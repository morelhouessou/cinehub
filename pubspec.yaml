name: cinehub
description: Flutter certification app - REST API, Supabase Auth, Dio, Hive, offline cache and Clean Architecture.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  supabase_flutter: ^2.8.0
  connectivity_plus: ^6.1.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
